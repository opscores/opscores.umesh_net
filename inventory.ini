# Inventory for Umesh Net deployment
# Supports Ubuntu 24/26 and Debian 12/13 only

[validator]
# VPS-1 - Validator node
# Set validator_mode: "genesis" or "join"
# For genesis mode: no additional vars needed (creates new chain)
# For join mode: set validator_mode=join, join_genesis_url, persistent_peers_for_join
{% raw %}
validator-node ansible_host=10.0.0.1 validator_mode=genesis sentinel_ip=10.0.1.1
{% endraw %}

[sentry]
# VPS-2 - Sentry node (public, protects validator)
{% raw %}
sentry-node ansible_host=10.0.1.1 validator_node_id=<VALIDATOR_NODE_ID> validator_ip=10.0.0.1
{% endraw %}

[rpc]
# VPS-3 - RPC node (public)
{% raw %}
rpc-node ansible_host=10.0.2.1 sentry_node_id=<SENTRY_NODE_ID> sentry_ip=10.0.1.1
{% endraw %}

[all:vars]
# Common variables (do not modify unless needed)
ansible_python_interpreter=/usr/bin/python3
repo_dest=/opt/node-umesh
firewall_enabled=true
firewall_ssh_port=22