# Inventory for Umesh Net deployment
# Supports Ubuntu 24/26 and Debian 12/13 only

[genesis]
# VPS-1 - Genesis validator (creates the blockchain)
# Set sentinel_ip for firewall rules
genesis-node ansible_host=10.0.0.1 sentinel_ip=10.0.1.1

[validator]
# VPS-2/3... - Validators (join existing blockchain)
# Set join_genesis_url and persistent_peers_for_join
validator-node ansible_host=10.0.1.1 join_genesis_url="" persistent_peers_for_join=""

[sentry]
# VPS-2 - Sentry node (public, protects validator)
sentry-node ansible_host=10.0.2.1 validator_node_id="" validator_ip=10.0.0.1

[rpc]
# VPS-3 - RPC node (public)
rpc-node ansible_host=10.0.3.1 sentry_node_id="" sentry_ip=10.0.2.1

[all:vars]
# Common variables
ansible_python_interpreter=/usr/bin/python3
repo_dest=/opt/umesh-node
firewall_enabled=true
firewall_ssh_port=22