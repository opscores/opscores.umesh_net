---
# RPC role tasks
# Covers sections 5.1 - 5.2 from MINSTART.md

# Include common setup
- name: Include common node setup
  ansible.builtin.include_role:
    name: opscores.umesh_net.common
  tags: [common]

# Configure firewall for RPC (section 2.3 - VPS-3)
- name: Set UFW default deny incoming for RPC
  ansible.builtin.ufw:
    direction: "incoming"
    policy: deny

- name: Set UFW default allow outgoing
  ansible.builtin.ufw:
    direction: "outgoing"
    policy: allow

- name: Configure UFW rules for RPC node
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ firewall_ssh_port }}"
    - "26657"  # RPC
    - "1317"   # REST
    - "9090"   # gRPC
    - "9091"   # gRPC-gateway
  when: firewall_enabled
  tags: [firewall, rpc]

- name: Enable UFW for RPC node
  ansible.builtin.ufw:
    state: enabled
  when: firewall_enabled
  tags: [firewall, rpc]

# Create .env file (BEFORE initialization!)
- name: Create .env.rpc file from template
  ansible.builtin.template:
    src: .env.rpc.j2
    dest: "{{ umesh_env_file_dest }}"
    mode: '0600'
  notify: "restart rpc node"
  tags: [config, rpc]

# Wrapped initialization and launch with error handling
- name: Initialize and launch RPC
  block:
    - name: Check if RPC is already initialized
      ansible.builtin.stat:
        path: "{{ umesh_data_path }}/config/genesis.json"
      register: genesis_check
      tags: [init, rpc]

    - name: Initialize RPC node
      ansible.builtin.command: >
        {{ repo_dest }}/tools/umeshctl/umeshctl setup init
        --role rpc
        --env-file {{ umesh_env_file_dest }}
      args:
        chdir: "{{ repo_dest }}"
      when: not genesis_check.stat.exists
      register: rpc_init
      changed_when: rpc_init.rc == 0
      tags: [init, rpc]

    - name: Check if RPC container is running
      ansible.builtin.command: docker ps -q -f name=umesh-rpc
      register: container_check
      changed_when: false
      tags: [start, rpc]

    - name: Launch RPC node with docker compose
      ansible.builtin.command: >
        docker compose
        --env-file {{ umesh_env_file_dest }}
        --profile rpc
        up -d
      args:
        chdir: "{{ repo_dest }}"
      when: container_check.stdout | length == 0
      register: rpc_start
      changed_when: rpc_start.rc == 0
      tags: [start, rpc]

    - name: Check RPC health
      ansible.builtin.shell: curl -s http://localhost:26657/health
      register: rpc_health
      changed_when: false
      failed_when: false
      tags: [check, rpc]
  rescue:
    - name: Show RPC setup stderr
      ansible.builtin.debug:
        var: rpc_init.stderr_lines
      when: rpc_init is defined and rpc_init.stderr | length > 0
      tags: [error, rpc]

    - name: Show docker compose stderr
      ansible.builtin.debug:
        var: rpc_start.stderr_lines
      when: rpc_start is defined and rpc_start.stderr | length > 0
      tags: [error, rpc]

    - name: Cleanup failed initialization
      file:
        path: "{{ umesh_data_path }}"
        state: absent
      tags: [cleanup, rpc]

    - name: Fail with error message
      ansible.builtin.fail:
        msg: "RPC initialization failed. Data directory {{ umesh_data_path }} has been cleaned up."
      tags: [error, rpc]
  tags: [init, rpc]

- name: Display RPC health
  ansible.builtin.debug:
    var: rpc_health.stdout