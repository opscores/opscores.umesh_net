---
# RPC role defaults
# Corresponds to .env.rpc from MINSTART.md section 6.3

node_mode: rpc
chain_id: umesh-testnet-1
denom: uumesh
min_gas_price: "0.0025uumesh"

# Cosmos SDK / WasmVM settings
wasm_memory_cache_size: 1024      # MiB
wasm_simulation_gas_limit: 50000000 # Gas limit for simulation

# Pruning settings
pruning_strategy: "custom"
pruning_keep_recent: 1000
pruning_interval: 100

# Network settings
genesis_url: ""
persistent_peers: ""
seeds: ""

# Bind IPs
rpc_p2p_bind_ip: 0.0.0.0
rpc_rpc_bind_ip: 0.0.0.0

# Resource limits
cpu_limit_rpc: "2.0"
memory_limit_rpc: 8g
memory_reservation_rpc: 4g

# OTEL settings
environment: production

# Data directory - internal constant
data_dir: data-rpc