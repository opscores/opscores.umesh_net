---
# Common variables for all Umesh node deployments
# Defaults for roles/common

# Supported OS: Ubuntu 24/26, Debian 12/13
supported_os:
  - { name: 'Ubuntu', versions: ['24', '26'] }
  - { name: 'Debian', versions: ['12', '13'] }

# Docker image (pre-built, pulled from GHCR — no local build needed)
docker_image_registry: ghcr.io/opscores
docker_image_name: umesh-node
docker_image_tag: latest
# Computed full image reference: used in .env templates and `docker pull`
docker_image: "{{ docker_image_registry }}/{{ docker_image_name }}:{{ docker_image_tag }}"

# Firewall
firewall_enabled: true
firewall_ssh_port: 22

# Repository (node source: docker-compose.yml, .env templates, data dirs)
repo_url: https://github.com/opscores/umesh-node.git
repo_branch: dev
repo_dest: /opt/umesh-node

# umeshctl — release binary downloaded from the umesh-cli repository.
# No Go toolchain or `just build-cli` required on the target host.
umeshctl_version: v0.1.0
umeshctl_path: /usr/local/bin/umeshctl
umeshcli_repo: https://github.com/opscores/umesh-cli

# Genesis plan YAML (downloaded from umesh-cli examples during common setup)
genesis_plan_config: "{{ repo_dest }}/genesis-plan.yaml"
