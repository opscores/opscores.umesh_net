---
# Common tasks for all Umesh node types
# Covers sections 2.1 - 2.5 from MINSTART.md
# Only supports Ubuntu 24/26 and Debian 12/13

- name: Validate supported OS
  ansible.builtin.assert:
    that:
      - "ansible_os_family == 'Debian' and
         (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version in ['24', '26']) or
         (ansible_distribution == 'Debian' and ansible_distribution_major_version in ['12', '13'])"
    success_msg: "Supported OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
    failure_msg: "Unsupported OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}. Only Ubuntu 24/26 and Debian 12/13 are supported."
  tags: [preflight, validate]

# Clone repository (section 2.2)
# Note: Docker installation is handled by the preflight role
- name: Ensure repository destination directory exists
  ansible.builtin.file:
    path: "{{ repo_dest | dirname }}"
    state: directory
    mode: '0755'
  tags: [repo, install]

- name: Clone umesh-node repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_branch }}"
    force: true
    update: true
  register: git_clone_result
  tags: [repo, install]

# docker-compose.yml mounts ./backups into every container;
# create it upfront so it is not created root-owned by Docker.
- name: Ensure backups directory exists
  ansible.builtin.file:
    path: "{{ repo_dest }}/backups"
    state: directory
    mode: '0755'
  tags: [repo, install]

# Pull Docker image from GHCR (pre-built, no local build needed).
# Only pull when the image is not yet present locally.
- name: Check if Docker image is already present
  ansible.builtin.command: "docker image inspect {{ docker_image }}"
  register: docker_image_exists
  changed_when: false
  failed_when: false
  tags: [build, docker]

- name: Pull Docker image from registry
  ansible.builtin.command: "docker pull {{ docker_image }}"
  register: docker_pull_result
  changed_when: docker_pull_result.rc == 0
  when: docker_image_exists.rc != 0
  tags: [build, docker]

# Download umeshctl release binary from the umesh-cli repository.
# No Go toolchain or `just build-cli` is required on the target host.
- name: Ensure umeshctl binary directory exists
  ansible.builtin.file:
    path: "{{ umeshctl_path | dirname }}"
    state: directory
    mode: '0755'
  tags: [build, cli]

- name: Download umeshctl sha256 checksum
  ansible.builtin.get_url:
    url: "{{ umeshcli_repo }}/releases/download/{{ umeshctl_version }}/umeshctl.sha256"
    dest: "{{ repo_dest }}/.umeshctl.sha256"
  tags: [build, cli]

- name: Parse umeshctl sha256 hash
  ansible.builtin.command: "cut -d ' ' -f1 {{ repo_dest }}/.umeshctl.sha256"
  register: umeshctl_sha256_hash
  changed_when: false
  tags: [build, cli]

- name: Download umeshctl binary
  ansible.builtin.get_url:
    url: "{{ umeshcli_repo }}/releases/download/{{ umeshctl_version }}/umeshctl"
    dest: "{{ umeshctl_path }}"
    mode: '0755'
    checksum: "sha256:{{ umeshctl_sha256_hash.stdout }}"
  tags: [build, cli]

- name: Verify umeshctl binary
  ansible.builtin.command: "{{ umeshctl_path }} version"
  changed_when: false
  tags: [build, cli]

# Download the genesis plan YAML from umesh-cli examples.
- name: Download genesis plan config
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/opscores/umesh-cli/{{ umeshctl_version }}/examples/genesis-plan.yaml"
    dest: "{{ genesis_plan_config }}"
    mode: '0644'
  register: genesis_plan_download
  tags: [build, cli]

# Prepare node config directory and keyring password file for umeshctl v0.2.0.
# umeshctl init requires a YAML config file (not .env) and keyring password via --keyring-password-file.
- name: Ensure node config directory exists
  ansible.builtin.file:
    path: "{{ node_config_dir }}"
    state: directory
    mode: '0755'
  tags: [config]

- name: Create keyring password file
  ansible.builtin.copy:
    content: "{{ keyring_password }}"
    dest: "{{ keyring_pass_file }}"
    mode: '0600'
  tags: [config]
