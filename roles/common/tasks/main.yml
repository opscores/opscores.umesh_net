---
# Common tasks for all Umesh node types
# Covers sections 2.1 - 2.5 from MINSTART.md
# Only supports Ubuntu 24/26 and Debian 12/13

- name: Validate supported OS
  ansible.builtin.assert:
    that:
      - "ansible_os_family == 'Debian' and
         (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version in ['24', '26']) or
         (ansible_distribution == 'Debian' and ansible_distribution_major_version in ['12', '13'])"
    success_msg: "Supported OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
    failure_msg: "Unsupported OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}. Only Ubuntu 24/26 and Debian 12/13 are supported."
  tags: [preflight, validate]

# Clone repository (section 2.2)
# Note: Docker installation is handled by the preflight role
- name: Ensure repository destination directory exists
  ansible.builtin.file:
    path: "{{ repo_dest | dirname }}"
    state: directory
    mode: '0755'
  tags: [repo, install]

- name: Clone node-umesh repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_branch }}"
    force: true
    update: true
  register: git_clone_result
  tags: [repo, install]

# docker-compose.yml mounts ./backups into every container;
# create it upfront so it is not created root-owned by Docker.
- name: Ensure backups directory exists
  ansible.builtin.file:
    path: "{{ repo_dest }}/backups"
    state: directory
    mode: '0755'
  tags: [repo, install]

- name: Get current commit hash for build
  ansible.builtin.command: "git -C {{ repo_dest }} rev-parse --short HEAD"
  register: git_commit_hash
  changed_when: false
  tags: [repo, build]

# Build Docker image (section 2.4, mirrors `just build-image`).
# Only rebuild when the repo was updated or the image is missing.
- name: Check if Docker image already exists
  ansible.builtin.command: >
    docker images -q {{ docker_image_tag }}:{{ docker_image_version }}
  register: docker_image_exists
  changed_when: false
  failed_when: false
  tags: [build, docker]

- name: Build Docker image
  ansible.builtin.command: >
    docker build --pull
    --build-arg VERSION={{ docker_build_version }}
    --build-arg COMMIT={{ git_commit_hash.stdout }}
    --build-arg SRC_PROVIDER={{ docker_src_provider }}
    -t {{ docker_image_tag }}:{{ docker_image_version }}
    -f Dockerfile .
  args:
    chdir: "{{ repo_dest }}"
  when: git_clone_result.changed or (docker_image_exists.stdout | length == 0)
  register: docker_build_result
  changed_when: docker_build_result.rc == 0
  tags: [build, docker]

# Build umeshctl (section 2.5, mirrors `just build-cli`).
# The script auto-detects local Go or falls back to Docker.
- name: Check if umeshctl binary exists
  ansible.builtin.stat:
    path: "{{ repo_dest }}/tools/umeshctl/umeshctl"
  register: umeshctl_binary
  tags: [build, cli]

- name: Build umeshctl CLI tool
  ansible.builtin.command: just build-cli
  args:
    chdir: "{{ repo_dest }}"
  when: git_clone_result.changed or not umeshctl_binary.stat.exists
  register: build_cli_result
  changed_when: build_cli_result.rc == 0
  tags: [build, cli]
