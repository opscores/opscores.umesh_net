---
# Sentry role tasks
# Covers sections 4.1 - 4.2 from MINSTART.md

# Include common setup
- name: Include common node setup
  ansible.builtin.include_role:
    name: opscores.umesh_net.common
  tags: [common]

# Configure firewall for Sentry (section 2.3 - VPS-2)
- name: Set UFW default deny incoming for sentry
  ansible.builtin.ufw:
    direction: "incoming"
    policy: deny

- name: Set UFW default allow outgoing
  ansible.builtin.ufw:
    direction: "outgoing"
    policy: allow

- name: Configure UFW rules for sentry
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ firewall_ssh_port }}"
    - "26656"  # P2P
    - "26657"  # RPC
    - "1317"   # REST
    - "9090"   # gRPC
    - "9091"   # gRPC-gateway
  when: firewall_enabled
  tags: [firewall, sentry]

- name: Enable UFW for sentry
  ansible.builtin.ufw:
    state: enabled
  when: firewall_enabled
  tags: [firewall, sentry]

# Create .env file (BEFORE initialization!)
- name: Create .env.sentry file
  ansible.builtin.template:
    src: .env.sentry.j2
    dest: "{{ umesh_env_file_dest }}"
    mode: '0600'
  notify: "restart sentry node"
  tags: [config, sentry]

# Wrapped initialization and launch with error handling
- name: Initialize and launch sentry
  block:
    - name: Check if sentry is already initialized
      ansible.builtin.stat:
        path: "{{ umesh_data_path }}/config/genesis.json"
      register: genesis_check
      tags: [init, sentry]

    - name: Create node config YAML file
      ansible.builtin.template:
        src: config-sentry.yaml.j2
        dest: "{{ umesh_config_path }}"
        mode: '0600'
      tags: [config, sentry]

    - name: Initialize sentry node
      ansible.builtin.command: >
        {{ umeshctl_path }} init sentry
        --config {{ umesh_config_path }}
        --keyring-password-file {{ keyring_pass_file }}
      args:
        chdir: "{{ repo_dest }}"
      when: not genesis_check.stat.exists
      register: sentry_init
      changed_when: sentry_init.rc == 0
      tags: [init, sentry]

    - name: Check if sentry container is running
      ansible.builtin.command: docker ps -q -f name=umesh-sentry
      register: container_check
      changed_when: false
      tags: [start, sentry]

    - name: Launch sentry node with docker compose
      ansible.builtin.command: >
        docker compose
        --env-file {{ umesh_env_file_dest }}
        --profile sentry
        up -d
      args:
        chdir: "{{ repo_dest }}"
      when: container_check.stdout | length == 0
      register: sentry_start
      changed_when: sentry_start.rc == 0
      tags: [start, sentry]

    - name: Check sentry peer count
      ansible.builtin.shell: >
        curl -s http://localhost:26657/net_info | jq '.result.n_peers'
      register: peer_count
      changed_when: false
      failed_when: false
      tags: [check, sentry]
  rescue:
    - name: Show sentry setup stderr
      ansible.builtin.debug:
        var: sentry_init.stderr_lines
      when: sentry_init is defined and sentry_init.stderr | length > 0
      tags: [error, sentry]

    - name: Show docker compose stderr
      ansible.builtin.debug:
        var: sentry_start.stderr_lines
      when: sentry_start is defined and sentry_start.stderr | length > 0
      tags: [error, sentry]

    - name: Cleanup failed initialization
      file:
        path: "{{ umesh_data_path }}"
        state: absent
      tags: [cleanup, sentry]

    - name: Fail with error message
      ansible.builtin.fail:
        msg: "Sentry initialization failed. Data directory {{ umesh_data_path }} has been cleaned up."
      tags: [error, sentry]
  tags: [init, sentry]

- name: Display peer count
  ansible.builtin.debug:
    var: peer_count.stdout

# Health check after deployment
- name: Check sentry peer count (post-deploy)
  ansible.builtin.shell: >
    curl -s http://localhost:26657/net_info | jq '.result.n_peers'
  register: peer_count
  changed_when: false
  tags: [check, sentry]

- name: Display peer count (post-deploy)
  ansible.builtin.debug:
    var: peer_count.stdout