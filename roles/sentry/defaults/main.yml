---
# Sentry role defaults
# Public gateway node

node_mode: sentry
chain_id: umesh-testnet-1
denom: uumesh
min_gas_price: "0.0025"
moniker: my-sentry

# Network settings
genesis_url: ""
genesis_sha256: ""
addrbook_url: ""
addrbook_sha256: ""
public_rpc_fallback: ""
persistent_peers: ""
seeds: ""

# Validator peer info
sentry_rpc: ""
validator_rpc: ""
sentry_external_address: ""
sentry_public_ip: ""
external_port: "26656"
use_private: "false"

# Keyring
keyring_password: change-me-secure

# Bind IPs
sentry_p2p_bind_ip: 0.0.0.0
sentry_rpc_bind_ip: 0.0.0.0
sentry_dc_bind_ip: 127.0.0.1

# Resource limits
cpu_limit_sentry: "2.0"
memory_limit_sentry: 8g
memory_reservation_sentry: 4g

# OTEL settings
environment: production

# Data directory
data_dir: data-sentry
data_path: "{{ repo_dest }}/{{ data_dir }}"

# Environment file
env_file_dest: "{{ repo_dest }}/.env.sentry"