---
# Genesis role handlers
# Genesis runs the validator container (profile: validator)

- name: restart validator node
  ansible.builtin.command: >
    docker compose
    --env-file {{ umesh_env_file_dest }}
    --profile validator
    restart
  args:
    chdir: "{{ repo_dest }}"
  listen: genesis_restarted

- name: stop validator node
  ansible.builtin.command: >
    docker compose
    --env-file {{ umesh_env_file_dest }}
    --profile validator
    down
  args:
    chdir: "{{ repo_dest }}"
  listen: genesis_stopped
