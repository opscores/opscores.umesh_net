---
# Genesis role defaults
# Creates a new blockchain by running genesis plan

node_mode: validator

# Chain parameters - these can be overridden by user
chain_id: umesh-testnet-1
denom: uumesh
min_gas_price: "0.0025uumesh"

# Cosmos SDK / WasmVM settings
wasm_memory_cache_size: 1024      # MiB
wasm_simulation_gas_limit: 50000000 # Gas limit for simulation

# Pruning settings
pruning_strategy: "custom"
pruning_keep_recent: 1000
pruning_interval: 100

# Genesis plan config path - internal constant
genesis_plan_config: "{{ repo_dest }}/tools/umeshctl/examples/genesis-plan.yaml"

# Validator parameters - these can be overridden by user
stake_amount: 1000000000000
self_delegation: 1000000000000
validator_name: validator
commission_rate: "0.05"
commission_max: "0.20"
commission_change: "0.01"
min_self_delegation: 1000000
keyring_password: change-me-secure

# Network settings - these can be overridden by user
validator_p2p_bind_ip: 0.0.0.0
validator_rpc_bind_ip: 127.0.0.1

# P2P settings
p2p_max_inbound_peers: 50
p2p_max_outbound_peers: 10

# Resource limits - these can be overridden by user
cpu_limit: "2.0"
memory_limit: 4g
memory_reservation: 2g

# OTEL settings
environment: production

# Data directory - internal constant, do not override
data_dir: data-validator