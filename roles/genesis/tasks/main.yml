---
# Genesis role tasks
# Creates a new blockchain by running genesis plan

# Include common setup
- name: Include common node setup
  ansible.builtin.include_role:
    name: opscores.umesh_net.common
  tags: [common]

# Include preflight checks
- name: Include preflight checks
  ansible.builtin.include_role:
    name: opscores.umesh_net.preflight
  tags: [preflight]

# Configure firewall for Genesis Validator
- name: Set UFW default incoming
  ansible.builtin.ufw:
    direction: "incoming"
    policy: deny
  tags: [firewall, genesis]

- name: Set UFW default allow outgoing
  ansible.builtin.ufw:
    direction: "outgoing"
    policy: allow
  tags: [firewall, genesis]

- name: Allow SSH via UFW
  ansible.builtin.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when: firewall_enabled
  tags: [firewall, genesis]

- name: Allow P2P from sentinel via UFW
  ansible.builtin.ufw:
    rule: allow
    port: "26656"
    proto: tcp
    src: "{{ sentinel_ip }}"
  when:
    - firewall_enabled
    - sentinel_ip is defined
  tags: [firewall, genesis]

- name: Enable UFW firewall
  ansible.builtin.ufw:
    state: enabled
    rule: allow
    port: "{{ firewall_ssh_port }}/tcp"
  when: firewall_enabled
  tags: [firewall, genesis]

# Create .env file (BEFORE setup plan!)
# NOTE: docker-compose.yml hardcodes env_file: .env.validator for the
# validator service, so genesis writes to .env.validator (MINSTART.md 3.3).
- name: Create .env.validator file from genesis template
  ansible.builtin.template:
    src: .env.genesis.j2
    dest: "{{ umesh_env_file_dest }}"
    mode: '0600'
  notify: "restart validator node"
  tags: [config, genesis]

# Wrapped setup plan and launch with error handling
- name: Initialize and launch genesis
  block:
    - name: Check if genesis is already initialized
      ansible.builtin.stat:
        path: "{{ umesh_data_path }}/config/genesis.json"
      register: genesis_check
      tags: [init, genesis]

    - name: Run genesis plan setup
      ansible.builtin.command: >
        {{ repo_dest }}/tools/umeshctl/umeshctl setup plan
        --config {{ genesis_plan_config }}
        --env-file {{ umesh_env_file_dest }}
      args:
        chdir: "{{ repo_dest }}"
      when: not genesis_check.stat.exists
      register: genesis_result
      changed_when: genesis_result.rc == 0
      tags: [genesis, setup]

    - name: Check if validator container is running
      ansible.builtin.command: docker ps -q -f name=umesh-validator
      register: container_check
      changed_when: false
      tags: [start, genesis]

    - name: Launch validator node with docker compose
      ansible.builtin.command: >
        docker compose
        --env-file {{ umesh_env_file_dest }}
        --profile validator
        up -d
      args:
        chdir: "{{ repo_dest }}"
      when: container_check.stdout | length == 0
      register: validator_start
      changed_when: validator_start.rc == 0
      tags: [start, genesis]

    - name: Show validator startup logs
      ansible.builtin.shell: docker logs -n 50 umesh-validator
      register: validator_logs
      changed_when: false
      tags: [debug, genesis]
  rescue:
    - name: Cleanup failed initialization
      file:
        path: "{{ umesh_data_path }}"
        state: absent
      tags: [cleanup, genesis]

    - name: Fail with error message
      ansible.builtin.fail:
        msg: "Genesis initialization failed. Data directory {{ umesh_data_path }} has been cleaned up."
      tags: [error, genesis]
  tags: [init, genesis]

- name: Display startup logs
  ansible.builtin.debug:
    var: validator_logs.stdout_lines
  when: validator_logs.stdout | length > 0

# Verify validator node
- name: Wait for validator RPC to be available
  ansible.builtin.uri:
    url: "http://{{ validator_rpc_bind_ip }}:26657/status"
    method: GET
    return_content: true
    timeout: 10
  register: validator_status
  retries: 10
  delay: 5
  until: "'latest_block_height' in validator_status.content"
  tags: [check, genesis]

- name: Show validator status
  ansible.builtin.debug:
    var: validator_status.content