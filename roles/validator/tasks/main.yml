---
# Validator role tasks
# Joins an existing blockchain as a validator

# Include common setup
- name: Include common node setup
  ansible.builtin.include_role:
    name: opscores.umesh_net.common
  tags: [common]

# Include preflight checks
- name: Include preflight checks
  ansible.builtin.include_role:
    name: opscores.umesh_net.preflight
  tags: [preflight]

# Configure firewall for Validator
- name: Set UFW default deny incoming
  ansible.builtin.ufw:
    direction: "incoming"
    policy: deny
  tags: [firewall, validator]

- name: Set UFW default allow outgoing
  ansible.builtin.ufw:
    direction: "outgoing"
    policy: allow
  tags: [firewall, validator]

- name: Allow SSH via UFW
  ansible.builtin.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when: firewall_enabled
  tags: [firewall, validator]

- name: Allow P2P from sentinel via UFW
  ansible.builtin.ufw:
    rule: allow
    port: "26656"
    proto: tcp
    src: "{{ sentinel_ip }}"
  when:
    - firewall_enabled
    - sentinel_ip is defined
  tags: [firewall, validator]

- name: Enable UFW firewall
  ansible.builtin.ufw:
    state: enabled
    rule: allow
    port: "{{ firewall_ssh_port }}/tcp"
  when: firewall_enabled
  tags: [firewall, validator]

# Create .env file (BEFORE initialization!)
- name: Create .env.validator file from template
  ansible.builtin.template:
    src: .env.validator.j2
    dest: "{{ env_file_dest }}"
    mode: '0600'
  notify: "restart validator node"
  tags: [config, validator]

# Wrapped initialization and launch with error handling
- name: Initialize and launch validator
  block:
    - name: Check if validator is already initialized
      ansible.builtin.stat:
        path: "{{ data_path }}/config/genesis.json"
      register: genesis_check
      tags: [init, validator]

    - name: Initialize validator node (join mode)
      ansible.builtin.command: >
        {{ repo_dest }}/tools/umeshctl/umeshctl setup init
        --role join
        --env-file {{ env_file_dest }}
      args:
        chdir: "{{ repo_dest }}"
      when: not genesis_check.stat.exists
      register: validator_init
      changed_when: validator_init.rc == 0
      tags: [init, validator]

    - name: Check if validator container is running
      ansible.builtin.command: docker ps -q -f name=umesh-validator
      register: container_check
      changed_when: false
      tags: [start, validator]

    - name: Launch validator node with docker compose
      ansible.builtin.command: >
        docker compose
        --env-file {{ env_file_dest }}
        --profile validator
        up -d
      args:
        chdir: "{{ repo_dest }}"
      when: container_check.stdout | length == 0
      register: validator_start
      changed_when: validator_start.rc == 0
      tags: [start, validator]

    - name: Show validator startup logs
      ansible.builtin.shell: docker logs -n 50 umesh-validator
      register: validator_logs
      changed_when: false
      tags: [debug, validator]

  rescue:
    - name: Cleanup failed initialization
      file:
        path: "{{ data_path }}"
        state: absent
      tags: [cleanup, validator]

    - name: Fail with error message
      ansible.builtin.fail:
        msg: "Validator initialization failed. Data directory {{ data_path }} has been cleaned up."
      tags: [error, validator]

- name: Display startup logs
  ansible.builtin.debug:
    var: validator_logs.stdout_lines
  when: validator_logs.stdout | length > 0
  tags: [debug, validator]

# Verify validator node
- name: Wait for validator RPC to be available
  ansible.builtin.uri:
    url: "http://{{ validator_rpc_bind_ip }}:26657/status"
    method: GET
    return_content: true
    timeout: 10
  register: validator_status
  retries: 10
  delay: 5
  until: "'latest_block_height' in validator_status.content"
  tags: [check, validator]

- name: Show validator status
  ansible.builtin.debug:
    var: validator_status.content