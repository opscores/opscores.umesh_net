---
# Validator role defaults
# Corresponds to .env.validator from MINSTART.md section 6.1

node_mode: validator
# Validator mode: 'genesis' (create new chain) or 'join' (join existing chain)
validator_mode: genesis

chain_id: umesh-testnet-1
denom: uumesh
min_gas_price: "0.0025"
moniker: my-validator
stake_amount: 1000000000000
self_delegation: 1000000000000
validator_name: validator
commission_rate: "0.05"
commission_max: "0.20"
commission_change: "0.01"
min_self_delegation: 1000000
keyring_password: change-me-secure

# Network settings
validator_p2p_bind_ip: 0.0.0.0
validator_rpc_bind_ip: 127.0.0.1

# Resource limits
cpu_limit: "2.0"
memory_limit: 4g
memory_reservation: 2g

# Data directory
data_dir: data-validator
data_path: "{{ repo_dest }}/{{ data_dir }}"

# Environment file
env_file_src: .env.validator.j2
env_file_dest: "{{ repo_dest }}/.env.validator"

# Validator mode specific settings
# For 'join' mode: provide existing chain info
join_peer: ""           # e.g., "node_id@ip:26656"
join_genesis_url: ""    # URL to download genesis.json
persistent_peers_for_join: ""