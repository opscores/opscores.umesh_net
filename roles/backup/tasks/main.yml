---
# Backup role tasks
# Creates a timestamped backup of node keys and configuration

- name: Validate umesh_role
  ansible.builtin.assert:
    that:
      - umesh_role in ['genesis', 'validator', 'sentry', 'rpc']
    fail_msg: "umesh_role must be one of: genesis, validator, sentry, rpc"
  tags: [backup, validate]

- name: Check node is initialized before backup
  ansible.builtin.stat:
    path: "{{ backup_data_path }}/config/genesis.json"
  register: backup_genesis_check
  tags: [backup, validate]

- name: Fail if node is not initialized
  ansible.builtin.fail:
    msg: "Node data not found at {{ backup_data_path }} — nothing to back up."
  when: not backup_genesis_check.stat.exists
  tags: [backup, validate]

# Key backup task is intentionally NOT wrapped in block/rescue:
# a failed backup must fail loudly, not silently skip.

- name: Create timestamped backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0700'
  tags: [backup, setup]

# Consensus keys only exist on roles that hold the validator key
- name: Backup consensus keys (genesis/validator only)
  ansible.builtin.copy:
    src: "{{ backup_data_path }}/{{ item }}"
    dest: "{{ backup_dir }}/{{ item | basename }}"
    remote_src: true
    mode: '0600'
  loop: "{{ backup_key_files }}"
  when: umesh_role in ['genesis', 'validator']
  tags: [backup, keys]

- name: Backup node configuration
  ansible.builtin.copy:
    src: "{{ backup_data_path }}/{{ item }}"
    dest: "{{ backup_dir }}/{{ item | basename }}"
    remote_src: true
    mode: '0644'
  loop: "{{ backup_config_files }}"
  tags: [backup, config]

- name: Compress backup into archive
  ansible.builtin.archive:
    path: "{{ backup_dir }}"
    dest: "{{ backup_dir }}.tar.gz"
    format: gz
  tags: [backup, compress]

- name: Remove uncompressed backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: absent
  tags: [backup, compress]

- name: Prune old backups beyond retention limit
  ansible.builtin.shell: >
    ls -1t {{ backup_dir_base }}/*.tar.gz 2>/dev/null
    | tail -n +{{ backup_retention | int + 1 }}
    | xargs -r rm -f
  args:
    executable: /bin/bash
  changed_when: false
  tags: [backup, prune]

- name: Show backup location
  ansible.builtin.debug:
    msg: "Backup created: {{ backup_dir }}.tar.gz"
  tags: [backup]
