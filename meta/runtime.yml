---
# Collection metadata for Ansible compatibility
# https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html#collection-metadata

version: "1.0"

# Commands that should be ignored when running in CI
commands:
  ignore:
    - ansible-doc
    - molecule

# Compatibility with Ansible versions
requires_ansible: ">=2.15"

# Plugin routing to avoid conflicts
plugins:
  modules:
    # Route module names to prevent conflicts
  lookup:
    # Route lookup plugin names
  connection:
    # Route connection plugin names
  vars:
    # Route vars plugin names

# Python interpreter settings
python_interpreter:
  ansible-core:
    command: python3