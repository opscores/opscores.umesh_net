---
# Verification playbook for Umesh node deployment
# Reference: MINSTART.md section 8

- name: Verify node deployment
  hosts: all
  become: false
  gather_facts: false

  vars:
    validator_mode: "{{ hostvars[inventory_hostname].validator_mode | default('genesis') }}"

  tasks:
    - name: Check node sync status
      ansible.builtin.shell: >
        curl -s http://localhost:26657/status | jq '.result.sync_info'
      register: sync_status
      changed_when: false
      tags: [verify, sync]

    - name: Check peer count
      ansible.builtin.shell: >
        curl -s http://localhost:26657/net_info | jq '.result.n_peers'
      register: n_peers
      changed_when: false
      tags: [verify, p2p]

    - name: Check validator voting power (validator only)
      ansible.builtin.shell: >
        curl -s http://localhost:26657/status | jq '.result.validator_info'
      register: validator_info
      changed_when: false
      when: "'validator' in group_names"
      tags: [verify, validator]

    - name: Show verification results
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          Validator Mode: {{ validator_mode }}
          Sync Info: {{ sync_status.stdout }}
          Catching Up: {{ sync_status.stdout | from_json .result.sync_info.catching_up | bool }}
          Peers: {{ n_peers.stdout }}
          Voting Power: {{ validator_info.stdout | from_json .result.validator_info.voting_power | default('N/A') }}
      tags: [verify, results]

    - name: Assert node is healthy
      ansible.builtin.assert:
        that:
          - sync_status.stdout | from_json .result.sync_info.catching_up == false
          - n_peers.stdout | int > 0
          - validator_info.stdout | from_json .result.validator_info.voting_power | default(0) | int > 0
        fail_msg: |
          Node health check failed:
          - Catching up: {{ sync_status.stdout | from_json .result.sync_info.catching_up }}
          - Peer count: {{ n_peers.stdout }}
          - Voting power: {{ validator_info.stdout | from_json .result.validator_info.voting_power | default('N/A') }}
        tags: [verify, assert]

    - name: Show validator mode
      ansible.builtin.debug:
        msg: "Validator mode: {{ validator_mode }}"
      when: "'validator' in group_names"
      tags: [verify, debug]