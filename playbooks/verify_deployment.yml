---
# Verification playbook for Umesh node deployment
# Reference: MINSTART.md section 8

- name: Verify node deployment
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Fetch node status
      ansible.builtin.uri:
        url: "http://localhost:26657/status"
        method: GET
        return_content: true
        timeout: 10
      register: status_result
      failed_when: status_result.status != 200
      tags: [verify, sync]

    - name: Fetch peer count
      ansible.builtin.uri:
        url: "http://localhost:26657/net_info"
        method: GET
        return_content: true
        timeout: 10
      register: net_info_result
      failed_when: net_info_result.status != 200
      tags: [verify, p2p]

    - name: Parse node facts
      ansible.builtin.set_fact:
        block_height: "{{ (status_result.json.result.sync_info.latest_block_height | default('0')) | int }}"
        catching_up: "{{ status_result.json.result.sync_info.catching_up | default(true) | bool }}"
        n_peers: "{{ (net_info_result.json.result.n_peers | default('0')) | int }}"
        voting_power: "{{ (status_result.json.result.validator_info.voting_power | default('0')) | int }}"
      tags: [verify]

    - name: Show verification results
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          Block Height: {{ block_height }}
          Catching Up: {{ catching_up }}
          Peers: {{ n_peers }}
          Voting Power: {{ voting_power }}
      tags: [verify, results]

    # Every node must have peers and a growing chain
    - name: Assert node is connected and syncing
      ansible.builtin.assert:
        that:
          - block_height | int > 0
          - catching_up | bool == false
          - n_peers | int > 0
        fail_msg: >-
          Node is not healthy: height={{ block_height }},
          catching_up={{ catching_up }}, peers={{ n_peers }}
      tags: [verify, assert]

    # Voting power check only makes sense for validators / genesis
    - name: Assert validator has voting power
      ansible.builtin.assert:
        that:
          - voting_power | int > 0
        fail_msg: >-
          Validator has no voting power: {{ voting_power }}
      when: "'validator' in group_names or 'genesis' in group_names"
      tags: [verify, assert, validator]
