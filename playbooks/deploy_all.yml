---
# Deploy full topology: Genesis → Validator → Sentry → RPC
# Deploy in order: Genesis first, then others

- name: Deploy Genesis Validator
  hosts: genesis
  become: true
  gather_facts: true
  serial: 1

  vars:
    sentinel_ip: ""

  roles:
    - role: opscores.umesh_net.genesis

- name: Deploy Validators (join existing chain)
  hosts: validator
  become: true
  gather_facts: true
  serial: 1

  vars:
    sentinel_ip: ""
    join_genesis_url: ""
    persistent_peers_for_join: ""

  roles:
    - role: opscores.umesh_net.validator

- name: Deploy Sentry nodes
  hosts: sentry
  become: true
  gather_facts: true
  serial: 1

  vars:
    validator_node_id: ""
    validator_ip: ""

  roles:
    - role: opscores.umesh_net.sentry

- name: Deploy RPC nodes
  hosts: rpc
  become: true
  gather_facts: true
  serial: 1

  vars:
    sentry_node_id: ""
    sentry_ip: ""

  roles:
    - role: opscores.umesh_net.rpc